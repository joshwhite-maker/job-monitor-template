name: Daily Job Monitor

on:
  schedule:
    # ~7am UTC on weekdays — adjust to taste (https://crontab.guru). Avoid
    # scheduling exactly on the hour (e.g. "0 7 * * 1-5") if you can: every
    # workflow on GitHub Actions with an on-the-hour cron queues at once,
    # so runs can drift by hours under load. A few minutes' offset avoids
    # that congestion. Cron is UTC-only and doesn't observe your local
    # daylight saving — revisit this twice a year if the exact time matters.
    - cron: "13 7 * * 1-5"
  # Also allows you to trigger a run manually from the Actions tab
  workflow_dispatch:

# Needed so the action can commit seen.json back to the repo
permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Run job monitor
        env:
          # Required — set these in repo Settings → Secrets and variables → Actions
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          # Optional — if set, each new role is scored against your profile
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python monitor.py

      - name: Commit updated seen.json, web_jobs.json, and digest_state.json
        run: |
          git config user.name "job-monitor[bot]"
          git config user.email "job-monitor@users.noreply.github.com"
          git add seen.json web_jobs.json digest_state.json
          # Only commit if something actually changed (seen.json IDs,
          # web_jobs.json's emailed/emailed_date flags — see grok/README.md
          # if you've set up the optional Grok layer — or the last-digest
          # timestamp used for the email's "since last digest" sections)
          git diff --staged --quiet || git commit -m "chore: update seen job IDs, web job email flags, and digest state [skip ci]"
          git push
